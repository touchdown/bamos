name: lint

on:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run shellcheck
        run: shellcheck --severity=warning bootstrap/*.sh provision.sh

  ansible:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install ansible-lint and ansible-core
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python ansible-lint==6.22 ansible-core==2.18

      - name: Install collection requirements
        run: .venv/bin/ansible-galaxy collection install -r requirements.yml

      - name: Run ansible-lint
        run: .venv/bin/ansible-lint playbooks/

