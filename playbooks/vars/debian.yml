---
# Debian/Ubuntu-specific variables

# apt installs require privilege escalation
package_install_become: true

# Packages for each role
system_tools_packages:
  - ripgrep
  - jq
  - fzf
  - tree
  - htop

shell_config_shell_packages:
  - zsh
  - git

llm_packages: []

llm_ollama_packages:
  - ollama

llm_casks: []
llm_taps: []
llm_formulae: []

# Paths
python_uv_bin_path: "/usr/bin/uv"

# Git
git_github_credential_helper: "libsecret"
git_github_use_keychain: false
