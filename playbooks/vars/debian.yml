---
# Debian/Ubuntu-specific variables

# apt installs require privilege escalation
package_install_become: true

# Packages for each role
system_tools_packages:
  - ripgrep
  - jq
  - fzf
  - tree
  - htop
  - postgresql-client

system_tools_brew_taps: []

shell_config_shell_packages:
  - zsh
  - git

llm_runtime_packages:
  - ollama

llm_runtime_casks: []
llm_runtime_taps: []
llm_runtime_formulae: []

# Coding agent role: shared tooling and per-agent install specs
# Note: on Debian the claude-code CLI is installed via npm (nodejs+npm below
# provide it: `npm install -g @anthropic-ai/claude-code`); opencode has no
# apt package, install via its official script if selected.
coding_agent_common_packages:
  - nodejs
  - npm

coding_agent_install_map:
  opencode:
    packages: []
    taps: []
    formulae: []
    casks: []
  claude-code:
    packages: []
    taps: []
    formulae: []
    casks: []

# Paths
python_uv_bin_path: "/usr/bin/uv"

# Git
git_github_credential_helper: "libsecret"
git_github_use_keychain: false
