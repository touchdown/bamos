---
# macOS-specific variables

# Homebrew installs run as the invoking user
package_install_become: false

# Packages for each role
system_tools_packages:
  - editorconfig-checker
  - ripgrep
  - jq
  - fzf
  - tree
  - htop
  - google-cloud-sdk
  - terraform
  - libpq

# Homebrew taps required by system_tools_packages (skipped on non-macOS)
system_tools_brew_taps:
  - hashicorp/tap

shell_config_shell_packages:
  - zsh
  - git

llm_runtime_packages: []

llm_runtime_casks:
  - ollama

llm_runtime_taps: []

llm_runtime_formulae: []

# Coding agent role: shared tooling and per-agent install specs
coding_agent_common_formulae:
  - node

coding_agent_install_map:
  opencode:
    packages: []
    taps:
      - anomalyco/tap
    formulae:
      - anomalyco/tap/opencode
    casks:
      - opencode-desktop
  claude-code:
    packages: []
    taps: []
    formulae: []
    casks:
      - claude-code

# Paths
python_uv_bin_path: "/opt/homebrew/bin/uv"
system_tools_psql_path: "/opt/homebrew/opt/libpq/bin"

# Git
git_github_credential_helper: "osxkeychain"
git_github_use_keychain: true
