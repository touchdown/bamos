---
- name: Provision Product Development Environment
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    local_config_path: "{{ ansible_facts.env.HOME }}/.config/vamos/local_vars.yml"

  pre_tasks:
    - name: Load OS-specific variables
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/{{ ansible_os_family | lower }}.yml"

    - name: Check for saved identity config
      ansible.builtin.stat:
        path: "{{ local_config_path }}"
      register: local_config_stat

    - name: Load saved identity config
      ansible.builtin.include_vars:
        file: "{{ local_config_path }}"
      when: local_config_stat.stat.exists

    - name: Ensure config directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.config/vamos"
        state: directory
        mode: '0700'

    - name: Prompt for Git user name
      ansible.builtin.pause:
        prompt: "Git user name:"
      register: git_name_prompt
      when: git_user_name is not defined

    - name: Prompt for Git user email
      ansible.builtin.pause:
        prompt: "Git user email:"
      register: git_email_prompt
      when: git_user_email is not defined

    - name: Resolve Git identity
      ansible.builtin.set_fact:
        git_user_name: "{{ git_user_name | default((git_name_prompt | default({})).user_input | default('')) }}"
        git_user_email: "{{ git_user_email | default((git_email_prompt | default({})).user_input | default('')) }}"

    - name: Validate Git identity
      ansible.builtin.fail:
        msg: "Git user name and email cannot be empty."
      when: not git_user_name or not git_user_email

    - name: Prompt for LLM runtime choice
      ansible.builtin.pause:
        prompt: |
          Which local LLM runtime(s) should be installed?
            - ollama : Ollama (default model server)
            - basert : BaseRT (fastest runtime on Apple Silicon)
            - both   : install both
          Enter your choice [ollama]:
      register: llm_runtime_prompt
      when:
        - llm_runtime is not defined
        - ansible_os_family | lower == 'darwin'

    - name: Resolve LLM runtime choice
      ansible.builtin.set_fact:
        llm_runtime: "{{ (llm_runtime_prompt.user_input | default('') | trim | lower) if (llm_runtime_prompt.user_input | default('')) else 'ollama' }}"
      when: llm_runtime_prompt is defined

    - name: Default LLM runtime to Ollama on unsupported platforms
      ansible.builtin.set_fact:
        llm_runtime: "ollama"
      when:
        - llm_runtime is not defined
        - ansible_os_family | lower != 'darwin'

    - name: Validate LLM runtime choice
      ansible.builtin.fail:
        msg: "llm_runtime must be one of: ollama, basert, both (got '{{ llm_runtime }}')."
      when: llm_runtime | lower not in ['ollama', 'basert', 'both']

    - name: Save Git identity locally for future runs
      ansible.builtin.copy:
        content: |
          git_user_name: "{{ git_user_name }}"
          git_user_email: "{{ git_user_email }}"
        dest: "{{ local_config_path }}"
        mode: '0600'

  roles:
    # 1. System CLI Tools (editorconfig-checker, etc.)
    - role: system_tools

    # 2. Desktop GUI Apps & Developer Fonts
    # - role: dev_apps

    # 3. Shell Runtime & Configuration (Zsh, OMZ, Aliases)
    - role: shell_config

    # 4. Identity, Version Control, & GitHub Access
    - role: git_github

    # 5. Language Tooling (Python 3.12 & uv)
    - role: python_uv

    # 6. LLM Environment (Ollama, OpenCode Desktop/CLI)
    - role: llm
