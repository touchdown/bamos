---
# Git Identity & Core Settings
# git_user_name / git_user_email are prompted via vars_prompt in product.yml
git_default_branch: "main"
git_editor: "vim"
git_credential_helper: "osxkeychain"

# SSH Key Path
ssh_key_path: "{{ ansible_facts.env.HOME }}/.ssh/id_ed25519"

# Quick Shell Shortcuts
git_shell_aliases:
  - { name: "g", cmd: "git" }
