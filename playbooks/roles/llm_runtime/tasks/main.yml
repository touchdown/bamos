---
# ------------------------------------------------------------------------------
# 1. Taps & Packages
# ------------------------------------------------------------------------------
- name: Install LLM system packages
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop: "{{ llm_runtime_packages }}"
  become: "{{ package_install_become }}"

- name: Tap custom repositories
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  loop: "{{ llm_runtime_taps }}"

- name: Install AI CLI utilities
  community.general.homebrew:
    name: "{{ item }}"
    state: present
  loop: "{{ llm_runtime_formulae }}"

- name: Install local AI desktop applications
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
  loop: "{{ llm_runtime_casks }}"

# ------------------------------------------------------------------------------
# 2. Pull Models into Ollama
# ------------------------------------------------------------------------------
- name: Check which Ollama models are present
  ansible.builtin.command: ollama list
  register: llm_runtime_ollama_list
  changed_when: false
  failed_when: false

- name: Pull models into Ollama
  ansible.builtin.command: "ollama pull {{ item }}"
  loop: "{{ llm_runtime_ollama_models }}"
  when: item not in llm_runtime_ollama_list.stdout
  changed_when: false
