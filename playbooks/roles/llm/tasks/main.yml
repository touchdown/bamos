---
# ------------------------------------------------------------------------------
# 1. Taps & Packages
# ------------------------------------------------------------------------------
- name: Install LLM system packages
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop: "{{ llm_packages }}"
  become: "{{ package_install_become }}"

- name: Tap custom repositories
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  loop: "{{ llm_taps }}"

- name: Install AI CLI utilities
  community.general.homebrew:
    name: "{{ item }}"
    state: present
  loop: "{{ llm_formulae }}"

- name: Install local AI desktop applications
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
  loop: "{{ llm_casks }}"

# ------------------------------------------------------------------------------
# 2. Pull Models into Ollama
# ------------------------------------------------------------------------------
- name: Check which Ollama models are present
  ansible.builtin.command: ollama list
  register: llm_ollama_list
  changed_when: false
  failed_when: false

- name: Pull models into Ollama
  ansible.builtin.command: "ollama pull {{ item }}"
  loop: "{{ llm_ollama_models }}"
  when: item not in llm_ollama_list.stdout
  changed_when: false

# ------------------------------------------------------------------------------
# 3. OpenCode Configuration Setup
# ------------------------------------------------------------------------------
- name: Ensure OpenCode config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/opencode"
    state: directory
    mode: '0755'

- name: Deploy OpenCode configuration pointing to Ollama
  ansible.builtin.template:
    src: opencode_config.json.j2
    dest: "{{ ansible_facts.env.HOME }}/.config/opencode/config.json"
    mode: '0644'

# ------------------------------------------------------------------------------
# 4. AI Agent Skills
# ------------------------------------------------------------------------------
- name: Ensure AI skills directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ llm_skills_dir }}"
    - "{{ llm_skill_sources_dir }}"

- name: Clone or update AI skill source repositories
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ llm_skill_sources_dir }}/{{ item.name }}"
    version: "{{ item.version | default('HEAD') }}"
  loop: "{{ llm_ai_skill_sources }}"

- name: Discover bundled skills in each source
  ansible.builtin.find:
    paths: "{{ llm_skill_sources_dir }}/{{ item.name }}/{{ item.skill_path | default('') }}"
    patterns: SKILL.md
    recurse: true
    file_type: file
  loop: "{{ llm_ai_skill_sources }}"
  register: llm_ai_skill_find

- name: Install bundled skills into the OpenCode global skills directory
  ansible.builtin.copy:
    src: "{{ item }}/"
    dest: "{{ llm_skills_dir }}/{{ item | basename }}/"
    mode: preserve
  loop: >-
    {{ llm_ai_skill_find.results
       | map(attribute='files') | flatten
       | map(attribute='path') | map('dirname') | unique | sort }}
